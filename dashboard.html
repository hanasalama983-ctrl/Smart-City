<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Spark City - Dashboard</title>

    <link rel="stylesheet" href="dashboard.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>

<body>

<div class="dashboard-container">

    <!-- SIDEBAR -->
    <aside class="sidebar">

        <div class="sidebar-logo">
            <img src="images/spark-city-logo.png" alt="Spark City">
        </div>

        <nav class="sidebar-menu">

            <a href="#" class="menu-item active">
                <i class="fa-solid fa-house"></i>
                <span>Dashboard</span>
            </a>

            <a href="#" class="menu-item">
                <i class="fa-solid fa-gear"></i>
                <span>Control center</span>
            </a>

            <a href="#" class="menu-item">
                <i class="fa-solid fa-house-chimney"></i>
                <span>Smart Home</span>
            </a>

            <a href="#" class="menu-item">
                <i class="fa-solid fa-car"></i>
                <span>Smart Traffic</span>
            </a>

            <a href="#" class="menu-item">
                <i class="fa-solid fa-triangle-exclamation"></i>
                <span>Emergency</span>
            </a>

            <a href="#" class="menu-item">
                <i class="fa-solid fa-trash-can"></i>
                <span>Waste Management</span>
            </a>

            <a href="#" class="menu-item">
                <i class="fa-solid fa-wind"></i>
                <span>Air Quality</span>
            </a>

            <a href="#" class="menu-item">
                <i class="fa-solid fa-square-parking"></i>
                <span>Parking</span>
            </a>

        </nav>

        <a href="index.html" class="logout">
            <i class="fa-solid fa-power-off"></i>
            <span>Log out</span>
        </a>

    </aside>


    <!-- MAIN CONTENT -->
    <main class="main-content">

        <!-- TOP BAR -->
        <header class="topbar">

            <label class="search-box">

                <i class="fa-solid fa-magnifying-glass"></i>

                <input type="text"
                id="searchInput"
                placeholder="Search alerts...">

            </label>

            <div class="admin-info">
                <i class="fa-regular fa-circle-user"></i>
                <span>Admin</span>
            </div>

        </header>


        <h1 class="dashboard-title">Dashboard</h1>


        <!-- STATISTICS -->
        <section class="statistics">

            <article class="stat-card">

                <div class="stat-icon">
                    <i class="fa-solid fa-car"></i>
                </div>

                <div class="stat-info">
                    <h3>Traffic Flow</h3>
                    <p>92%</p>
                </div>

            </article>


            <article class="stat-card">

                <div class="stat-icon">
                    <i class="fa-solid fa-wind"></i>
                </div>

                <div class="stat-info">
                    <h3>Air Quality</h3>
                    <p>Good</p>
                </div>

            </article>


            <article class="stat-card">

                <div class="stat-icon">
                    <i class="fa-solid fa-recycle"></i>
                </div>

                <div class="stat-info">
                    <h3>Waste Level</h3>
                    <p class="yellow">68%</p>
                </div>

            </article>

        </section>


        <!-- CITY AND ALERTS -->
        <section class="middle-section">

            <article class="city-status panel">

                <div class="section-title">
                    <i class="fa-solid fa-location-dot"></i>
                    <h2>City Status</h2>
                </div>

                <div class="city-map">

                    <svg class="map-art" viewBox="0 0 900 300">

                        <defs>

                            <pattern id="blocks"
                            width="90" height="65"
                            patternUnits="userSpaceOnUse">

                                <rect x="8" y="8" width="30"
                                height="22" rx="3"
                                fill="#14516a"/>

                                <rect x="46" y="8" width="35"
                                height="22" rx="3"
                                fill="#0d4057"/>

                                <rect x="8" y="38" width="73"
                                height="18" rx="3"
                                fill="#176078"/>

                            </pattern>

                            <linearGradient id="mapfade"
                            x1="0" y1="0" x2="0" y2="1">

                                <stop offset="0" stop-color="#073247"/>
                                <stop offset="1" stop-color="#041c2b"/>

                            </linearGradient>

                        </defs>


                        <rect width="900" height="300"
                        fill="url(#mapfade)"/>

                        <rect width="900" height="300"
                        fill="url(#blocks)" opacity=".8"/>


                        <g fill="none" stroke="#8bdcf0"
                        stroke-width="12" opacity=".8">

                            <path d="M-20 230 C150 180 210 250 350 185 S610 80 920 120"/>

                            <path d="M110 -20 C180 65 250 90 330 320"/>

                            <path d="M610 -20 C560 80 630 170 700 320"/>

                        </g>


                        <g fill="none" stroke="#e4fbff"
                        stroke-width="2"
                        stroke-dasharray="10 12">

                            <path d="M-20 230 C150 180 210 250 350 185 S610 80 920 120"/>

                            <path d="M110 -20 C180 65 250 90 330 320"/>

                            <path d="M610 -20 C560 80 630 170 700 320"/>

                        </g>


                        <g>

                            <circle cx="250" cy="205" r="17"
                            fill="#21d6b0" stroke="#d8ffff"
                            stroke-width="4"/>

                            <circle cx="575" cy="145" r="17"
                            fill="#ffbf35" stroke="#fff4cf"
                            stroke-width="4"/>

                            <circle cx="735" cy="115" r="17"
                            fill="#ef5350" stroke="#ffe1e1"
                            stroke-width="4"/>

                        </g>


                        <g fill="#d9f8ff"
                        font-family="Arial"
                        font-size="15"
                        font-weight="bold">

                            <text x="275" y="210">Central District</text>
                            <text x="600" y="150">Traffic Hub</text>
                            <text x="760" y="120">Alert Zone</text>

                        </g>

                    </svg>

                </div>

            </article>


            <!-- RECENT ALERTS -->
            <article class="alerts panel">

                <div class="section-title">

                    <i class="fa-solid fa-bell"></i>

                    <h2>Recent Alerts</h2>

                    <i class="fa-solid fa-chevron-right arrow"></i>

                </div>


                <div class="alert-list">

                    <div class="alert-item">

                        <i class="fa-solid fa-triangle-exclamation warning"></i>

                        <span>Traffic Heavy</span>

                        <i class="fa-solid fa-chevron-right"></i>

                    </div>


                    <div class="alert-item">

                        <i class="fa-solid fa-triangle-exclamation danger"></i>

                        <span>Smoke Detected</span>

                        <i class="fa-solid fa-chevron-right"></i>

                    </div>

                </div>

            </article>

        </section>


        <!-- BOTTOM SECTION -->
        <section class="bottom-section">


            <!-- QUICK ACTIONS -->
            <article class="quick-actions panel">

                <div class="section-title">

                    <i class="fa-solid fa-bolt yellow-icon"></i>

                    <h2>Quick Actions</h2>

                    <i class="fa-solid fa-chevron-right arrow"></i>

                </div>


                <div class="actions-container">


                    <button class="action-card" data-action="parking">

                        <span class="action-icon">
                            <i class="fa-solid fa-car"></i>
                        </span>

                        <span>Manage<br>Parking</span>

                    </button>


                    <button class="action-card" data-action="gate">

                        <span class="action-icon">
                            <i class="fa-solid fa-house"></i>
                        </span>

                        <span>Open<br>Gate</span>

                    </button>


                    <button class="action-card" data-action="alert">

                        <span class="action-icon red-icon">
                            <i class="fa-solid fa-bell"></i>
                        </span>

                        <span>Send<br>Alert</span>

                    </button>


                    <button class="action-card" data-action="irrigation">

                        <span class="action-icon green-icon">
                            <i class="fa-solid fa-seedling"></i>
                        </span>

                        <span>Irrigation</span>

                    </button>


                </div>

            </article>


            <!-- ENERGY CONSUMPTION -->
            <article class="energy-card panel">

                <div class="section-title">

                    <i class="fa-solid fa-bolt yellow-icon"></i>

                    <h2>Energy Consumption</h2>

                </div>


                <div class="chart">

                    <div class="bar" style="height:25%"></div>
                    <div class="bar" style="height:18%"></div>
                    <div class="bar" style="height:22%"></div>
                    <div class="bar" style="height:35%"></div>
                    <div class="bar" style="height:38%"></div>
                    <div class="bar" style="height:45%"></div>
                    <div class="bar" style="height:48%"></div>
                    <div class="bar" style="height:55%"></div>
                    <div class="bar" style="height:80%"></div>
                    <div class="bar" style="height:100%"></div>
                    <div class="bar" style="height:88%"></div>
                    <div class="bar muted" style="height:65%"></div>
                    <div class="bar muted" style="height:75%"></div>
                    <div class="bar muted" style="height:35%"></div>
                    <div class="bar muted" style="height:25%"></div>
                    <div class="bar muted" style="height:22%"></div>
                    <div class="bar muted" style="height:18%"></div>
                    <div class="bar muted" style="height:15%"></div>

                </div>

            </article>

        </section>

    </main>

</div>

<script src="dashboard.js"></script>

</body>
</html>
